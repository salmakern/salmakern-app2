[[redirects]]
  from = "/nettside"
  to = "/nettside/index.html"
  status = 200

# salmakern.html (ansatt-booking) røres ikke - den ligger fortsatt på sin egen
# adresse, uendret, og lenkes ikke til fra noe sted på den offentlige nettsiden.

[[redirects]]
  from = "/*"
  to = "/nettside/:splat"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
