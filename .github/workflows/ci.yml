name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sjekk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer devDependencies
        run: npm install

      - name: Syntakssjekk (node --check)
        run: npm run check

      - name: Enhetstester (Vitest)
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint
